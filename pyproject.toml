[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sg-hiking-gain"
version = "0.1.0"
description = "Local CLI for finding high cumulative elevation gain walking and hiking routes in Singapore."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "requests>=2.32",
  "pyyaml>=6.0",
  "geopandas>=1.0",
  "shapely>=2.0",
  "pyproj>=3.6",
  "pyogrio>=0.9",
  "scipy>=1.13",
  "networkx>=3.3",
  "pandas>=2.2",
  "numpy>=1.26",
  "jinja2>=3.1",
  "matplotlib>=3.8",
  "gpxpy>=1.6",
  "pyarrow>=16.0",
]

[project.scripts]
sggain = "sggain.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/sggain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
  "pytest>=8.2",
]
